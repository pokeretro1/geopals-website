<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Gallery &mdash; Geopals</title>
<meta name="description" content="Every card in the Geopals Trading Card Game. Browse the artwork, search by name or ability, and filter by region, rarity and type.">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/gallery.css">
<link rel="stylesheet" href="assets/css/holo.css">
<link rel="icon" href="assets/img/favicon.svg">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark">GP</span>
    <span class="brand-name">Geopals</span>
  </a>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="cards.html" class="is-current">Cards</a>
    <a href="index.html#videos">Videos</a>
    <a href="index.html#learn">How to Play</a>
  </nav>
</header>

<main class="gal">

  <div class="gal-head">
    <h1>Card Gallery</h1>
    <p class="gal-lede">Every card in the set. Search by name or by what a card does, then narrow it down.
      Select any card to see its abilities in full.</p>
  </div>

  <div class="gal-controls">
    <input type="search" id="search" class="gal-search" autocomplete="off"
           placeholder="Search cards, abilities, illustrators&hellip;"
           aria-label="Search cards by name, ability text or illustrator">

    <div class="gal-filters" id="filters">
      <!-- Type, region, rarity, stage, style and holo are generated from the data. -->
    </div>

    <div class="gal-filters">
      <label>Sort
        <select id="sort" aria-label="Sort cards">
          <option value="id-asc">Card number</option>
          <option value="name-asc">Name A to Z</option>
          <option value="name-desc">Name Z to A</option>
          <option value="rarity-desc">Rarest first</option>
          <option value="region-asc">Region</option>
        </select>
      </label>
      <div class="gal-actions">
        <span class="gal-count" id="count" role="status"></span>
        <button type="button" id="clear" class="gal-clear">Clear</button>
      </div>
    </div>
  </div>

  <div id="grid" class="gal-grid" aria-live="polite"></div>
  <p id="empty" class="gal-empty" hidden>No cards match those filters.</p>

</main>

<dialog id="modal" class="gal-modal" aria-label="Card details">
  <div class="gal-modal-wrap">
    <button type="button" class="gal-close" aria-label="Close">&times;</button>
    <div class="gal-modal-in" id="modal-in"></div>
  </div>
</dialog>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> Geopals Trading Card Game.</p>
  <p class="muted">geopals.com.au</p>
</footer>

<!-- Data first, then the app. Loading data via <script> (not fetch) means this page
     also works when opened straight off disk, with no local web server. -->
<script src="data/cards.js"></script>
<script src="assets/js/holo.js"></script>
<script src="assets/js/card-gallery.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
